version: 2

sources:
  - name: ZOOM_AI_POC
    description: "Raw interaction history tables in the target database's RAW schema."
    # Database is parameterized so V1 (default ZOOM_AI_POC) and V2
    # (override via SNOWFLAKE_DATABASE=ZOOM_AI_POC_V2) both resolve.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ZOOM_AI_POC') }}"
    schema: RAW

    tables:
      - name: phone_history
        description: "Raw phone interaction records"
        columns:
          - name: record_id
            description: "Unique record identifier"
            tests: [not_null, unique]
          - name: account_id
            tests: [not_null]
          - name: agent_hash_id
            tests: [not_null]
          - name: engagement_id
            tests: [not_null]
          - name: channel
          - name: start_time
            tests: [not_null]
          - name: duration_sec
          - name: direction
            tests:
              - accepted_values:
                  values: ['Inbound', 'Outbound']
          - name: final_outcome
            tests:
              - accepted_values:
                  values: ['Answered', 'Missed', 'Resolved', 'Closed']
          - name: sla_achieved
          - name: _loaded_at

      - name: sms_history
        description: "Raw SMS interaction records"
        columns:
          - name: record_id
            tests: [not_null, unique]
          - name: account_id
            tests: [not_null]
          - name: agent_hash_id
            tests: [not_null]
          - name: engagement_id
            tests: [not_null]
          - name: channel
          - name: start_time
            tests: [not_null]
          - name: duration_sec
          - name: direction
          - name: final_outcome
          - name: sla_achieved
          - name: _loaded_at

      - name: chat_history
        description: "Raw chat interaction records"
        columns:
          - name: record_id
            tests: [not_null, unique]
          - name: account_id
            tests: [not_null]
          - name: agent_hash_id
            tests: [not_null]
          - name: engagement_id
            tests: [not_null]
          - name: channel
          - name: start_time
            tests: [not_null]
          - name: duration_sec
          - name: direction
          - name: final_outcome
          - name: sla_achieved
          - name: _loaded_at

      - name: email_history
        description: "Raw email interaction records"
        columns:
          - name: record_id
            tests: [not_null, unique]
          - name: account_id
            tests: [not_null]
          - name: agent_hash_id
            tests: [not_null]
          - name: engagement_id
            tests: [not_null]
          - name: channel
          - name: start_time
            tests: [not_null]
          - name: duration_sec
          - name: direction
          - name: final_outcome
          - name: sla_achieved
          - name: _loaded_at

      - name: video_history
        description: "Raw video interaction records"
        columns:
          - name: record_id
            tests: [not_null, unique]
          - name: account_id
            tests: [not_null]
          - name: agent_hash_id
            tests: [not_null]
          - name: engagement_id
            tests: [not_null]
          - name: channel
          - name: start_time
            tests: [not_null]
          - name: duration_sec
          - name: direction
          - name: final_outcome
          - name: sla_achieved
          - name: _loaded_at

      - name: account_dim
        description: >
          Real account dimension (region, segment, is_licensed) — one fixed
          row per account. Present in ZOOM_AI_POC_V2; ABSENT in V1, where the
          gold model degrades gracefully to its hash-based placeholders.
          NOTE: source-level tests are intentionally NOT declared here because
          this raw table does not exist in every environment (V1). Data-quality
          tests live on the bronze view brz_account_dim, which has an empty
          typed fallback and therefore tests cleanly in both V1 and V2.
        columns:
          - name: account_id
            description: "Account business key"
          - name: account_name
            description: "Human-readable account name"
          - name: region
            description: "Geographic region: NAMER, APAC, EMEA, LATAM"
          - name: segment
            description: "Customer segment code (1–5)"
          - name: is_licensed
            description: "True if the account holds a paid licence"
          - name: _loaded_at

version: 2

# =============================================================================
# _bronze_models.yml  –  documentation and tests for all 5 bronze models
# =============================================================================

models:

  - name: brz_phone_history
    description: "Bronze view over RAW.PHONE_HISTORY. Renames columns and enforces types."
    columns:
      - name: record_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: start_time
        tests: [not_null]
      - name: direction
        tests:
          - accepted_values:
              values: ['INBOUND', 'OUTBOUND']
      - name: source_table
        tests:
          - accepted_values:
              values: ['PHONE_HISTORY']

  - name: brz_sms_history
    description: "Bronze view over RAW.SMS_HISTORY."
    columns:
      - name: record_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: start_time
        tests: [not_null]
      - name: source_table
        tests:
          - accepted_values:
              values: ['SMS_HISTORY']

  - name: brz_chat_history
    description: "Bronze view over RAW.CHAT_HISTORY."
    columns:
      - name: record_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: source_table
        tests:
          - accepted_values:
              values: ['CHAT_HISTORY']

  - name: brz_email_history
    description: "Bronze view over RAW.EMAIL_HISTORY."
    columns:
      - name: record_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: source_table
        tests:
          - accepted_values:
              values: ['EMAIL_HISTORY']

  - name: brz_video_history
    description: "Bronze view over RAW.VIDEO_HISTORY."
    columns:
      - name: record_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: source_table
        tests:
          - accepted_values:
              values: ['VIDEO_HISTORY']

  - name: brz_account_dim
    description: >
      Bronze view over RAW.ACCOUNT_DIM. One row per account carrying the real
      region / segment / is_licensed attributes. Only present in environments
      whose RAW schema contains ACCOUNT_DIM (V2); the gold model tolerates its
      absence in V1.
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: region
        tests:
          - not_null
          - accepted_values:
              values: ['NAMER', 'APAC', 'EMEA', 'LATAM']
      - name: segment
        tests: [not_null]
      - name: is_licensed
        tests: [not_null]
      - name: source_table
        tests:
          - accepted_values:
              values: ['ACCOUNT_DIM']

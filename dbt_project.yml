
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_zoom_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_zoom_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  dbt_zoom_project:
    bronze:
      +schema: BRONZE
      +materialized: view
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      +schema: GOLD
      +materialized: table

# Seeds land in the RAW schema of the target database so they satisfy the
# existing source() definitions (RAW.PHONE_HISTORY etc.). generate_schema_name
# returns the custom schema verbatim, so +schema: RAW resolves to
# <target_db>.RAW for whichever database the env vars point at (V1 or V2).
seeds:
  dbt_zoom_project:
    +schema: RAW
    # quote_columns: true keeps reserved-word columns (DIRECTION, IS_LICENSED)
    # valid in the generated DDL. CSV headers are UPPERCASE so the quoted
    # identifiers match Snowflake's default casing and existing source() SQL.
    # Types are left to dbt's CSV inference; the bronze views cast everything
    # (start_time -> timestamp_ntz, duration_sec -> float, sla_achieved -> bool)
    # so RAW column types do not need to be pinned here.
    +quote_columns: true
